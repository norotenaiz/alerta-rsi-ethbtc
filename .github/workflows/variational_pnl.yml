name: Variational XAU/XAG PNL

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  check-pnl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      - name: Restaurar estado
        uses: actions/cache/restore@v4
        with:
          path: state
          key: variational-state-${{ github.run_id }}
          restore-keys: variational-state-

      - name: Comprobar PNL
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN_1 }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python variational_pnl.py

      - name: Guardar estado
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: variational-state-${{ github.run_id }}
