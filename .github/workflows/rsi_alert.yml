name: Alerta RSI ETH/BTC y XAU/XAG

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  check-rsi:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Configurar entorno Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas yfinance

      - name: Ejecutar verificación de RSI
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN_1 }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python rsi_alert_bot.py
